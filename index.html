<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites of Memory — Demo</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet"
 href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css">

<script type="importmap">
{
  "imports": {
    "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
    "maplibre-gl": "https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs"
  }
}
</script>

<style>
:root {
  --brown: #3D332B;
  --burgundy: #783F43;
  --ivory: #F4EFE5;
  --paper: #E8DFD0;
  --ink: #302B26;
  --border: #C8BBA8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, sans-serif;
}
header {
  background: var(--brown);
  color: #FFF9F0;
  padding: 16px 22px;
}
h1 { margin: 0 0 6px; font: 26px Georgia, serif; }
header p { margin: 0; line-height: 1.4; font-size: 14px; }
.notice {
  background: #FFF9F0;
  padding: 9px 22px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
main {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 340px;
}
.filters, .details {
  padding: 20px;
  background: var(--ivory);
  overflow-y: auto;
}
.filters { border-right: 1px solid var(--border); }
.details {
  background: #FFF9F0;
  border-left: 1px solid var(--border);
  line-height: 1.5;
}
h2 { margin: 0 0 14px; font: 23px Georgia, serif; }
h3 { font: 19px Georgia, serif; }
label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin: 15px 0 6px;
}
select, button {
  width: 100%;
  font: inherit;
  padding: 10px;
  border-radius: 4px;
}
select {
  color: var(--ink);
  background: #FFF9F0;
  border: 1px solid var(--border);
}
button {
  border: 0;
  background: var(--burgundy);
  color: white;
  cursor: pointer;
  margin-top: 14px;
}
button:hover { background: #603236; }
button:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid #365F75;
  outline-offset: 3px;
}
#map { width: 100%; min-width: 0; background: #E8DFD0; }
#count { font-size: 14px; line-height: 1.5; }
.legend-item {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  margin: 10px 0;
}
.swatch {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  flex-shrink: 0;
}
.details dl { margin: 18px 0 0; }
.details dt { font-weight: bold; font-size: 14px; }
.details dd {
  margin: 3px 0 15px;
  overflow-wrap: anywhere;
  font-size: 14px;
}
.details a { color: var(--burgundy); }
.details figure { margin: 18px 0; }
.details img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
}
.details figcaption {
  font-size: 12px;
  margin-top: 8px;
  color: #584A3E;
}
.image-placeholder {
  width: 100%;
  aspect-ratio: 16 / 10;
  background: var(--paper);
  border: 1px dashed #A99883;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  color: #584A3E;
  text-align: center;
}
.image-placeholder span { font-size: 13px; }
.demo-tag {
  font-size: 12px;
  padding: 7px 9px;
  background: var(--paper);
  border-radius: 4px;
}
.pin-icon { background: transparent; border: 0; }
.pin {
  width: 28px;
  height: 28px;
  border: 2px solid white;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 2px 5px #0006;
  position: relative;
}
.pin::after {
  content: "";
  position: absolute;
  top: 8px;
  left: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: white;
}
@media (min-width: 1000px) {
  body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header, .notice { flex-shrink: 0; }
  main { flex: 1; min-height: 0; }
  .filters, .details, #map { height: 100%; min-height: 0; }
}
@media (max-width: 999px) {
  main { grid-template-columns: 230px minmax(0, 1fr); }
  #map { height: 60vh; height: 60dvh; min-height: 320px; }
  .details {
    grid-column: 1 / -1;
    border-left: 0;
    border-top: 1px solid var(--border);
  }
  .details figure { max-width: 450px; }
}
@media (max-width: 600px) {
  main { display: flex; flex-direction: column; }
  .filters { border-right: 0; }
  #map { height: 55vh; height: 55dvh; min-height: 300px; }
  h1 { font-size: 23px; }
}
</style>
</head>

<body>
<header>
  <h1>Court-Ordered Sites of Memory</h1>
  <p>Monuments, memorials, and sites of conscience in Latin America</p>
</header>

<div class="notice">
  <strong>Demo — fictional data.</strong>
  Five imaginary sites represent four imaginary cases.
  Coordinates are illustrative.
</div>

<main>
  <aside class="filters">
    <label for="country">Country</label>
    <select id="country"></select>

    <label for="type">Site type</label>
    <select id="type"></select>

    <label for="status">Implementation status</label>
    <select id="status"></select>

    <button id="reset" type="button">Reset filters</button>
    <p id="count" role="status" aria-live="polite"></p>

    <h3>Legend</h3>
    <div id="legend"></div>
  </aside>

  <div id="map" aria-label="Map of fictional sites"></div>

  <section class="details" id="details"
           aria-labelledby="details-title">
    <h2 id="details-title">Select a site</h2>
    <p>Click a pin to display its photograph area and case details.</p>
  </section>
</main>

<script type="module">
import * as L from "leaflet";
import { maplibreGL } from
  "https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/dist/leaflet-maplibre-gl.mjs";

/* FICTIONAL TEST DATA */
const sites = [
  {
    id: "TEST001",
    name: "Fictional Memorial of the River",
    type: "Memorial",
    country: "Argentina",
    city: "Buenos Aires",
    lat: -34.6037, lng: -58.3816,
    caseId: "TESTCASE001",
    caseName: "Fictional River Families v. Argentina",
    judgmentDate: "2015-06-12",
    measure: "Construct a memorial commemorating victims and identifying their names.",
    status: "Completed",
    inaugurationDate: "2019-03-24",
    description: "A fictional memorial demonstrating how a completed site could be presented.",
    verified: "2026-10-04",
    judgmentUrl: "", implementationUrl: "",
    imageUrl: "", imageCaption: "", imageCredit: ""
  },
  {
    id: "TEST002",
    name: "Fictional Plaza of Remembrance",
    type: "Monument",
    country: "Chile",
    city: "Santiago",
    lat: -33.4489, lng: -70.6693,
    caseId: "TESTCASE002",
    caseName: "Fictional Plaza Survivors v. Chile",
    judgmentDate: "2018-09-20",
    measure: "Install a public monument with an inscription acknowledging the victims.",
    status: "In progress",
    inaugurationDate: "",
    description: "A fictional monument under construction following an imaginary Court order.",
    verified: "2026-10-04",
    judgmentUrl: "", implementationUrl: "",
    imageUrl: "", imageCaption: "", imageCredit: ""
  },
  {
    id: "TEST003",
    name: "Fictional House of Memory",
    type: "Site of conscience",
    country: "Peru",
    city: "Lima",
    lat: -12.0464, lng: -77.0428,
    caseId: "TESTCASE003",
    caseName: "Fictional House Families v. Peru",
    judgmentDate: "2020-02-14",
    measure: "Establish a public site for remembrance and human rights education.",
    status: "Pending",
    inaugurationDate: "",
    description: "A fictional proposed memory site that has not yet been established.",
    verified: "2026-10-04",
    judgmentUrl: "", implementationUrl: "",
    imageUrl: "", imageCaption: "", imageCredit: ""
  },
  {
    id: "TEST004",
    name: "Fictional Garden of Names",
    type: "Memorial",
    country: "Colombia",
    city: "Bogotá",
    lat: 4.7110, lng: -74.0721,
    caseId: "TESTCASE004",
    caseName: "Fictional Garden Community v. Colombia",
    judgmentDate: "2016-11-08",
    measure: "Create a memorial garden displaying the names of victims.",
    status: "Completed",
    inaugurationDate: "2021-12-10",
    description: "A fictional garden demonstrating another completed commemorative site.",
    verified: "2026-10-04",
    judgmentUrl: "", implementationUrl: "",
    imageUrl: "", imageCaption: "", imageCredit: ""
  },
  {
    id: "TEST005",
    name: "Fictional Memory Exhibition",
    type: "Other commemorative site",
    country: "Peru",
    city: "Lima",
    lat: -12.0600, lng: -77.0300,
    caseId: "TESTCASE003",
    caseName: "Fictional House Families v. Peru",
    judgmentDate: "2020-02-14",
    measure: "Create a permanent commemorative exhibition at a second location.",
    status: "Not verified",
    inaugurationDate: "",
    description: "A second fictional site linked to the same imaginary case as the House of Memory.",
    verified: "2026-10-04",
    judgmentUrl: "", implementationUrl: "",
    imageUrl: "", imageCaption: "", imageCredit: ""
  }
];

const colours = {
  "Monument": "#365F75",
  "Memorial": "#783F43",
  "Site of conscience": "#466747",
  "Other commemorative site": "#946318"
};

const map = L.map("map", {
  scrollWheelZoom: false,
  minZoom: 1,
  maxZoom: 19,
  maxBounds: [[-85, -Infinity], [85, Infinity]],
  maxBoundsViscosity: 1
}).setView([-17, -66], 3);

/* OPENFREEMAP: prefer English names.
   Proper names are retained when an English name is unavailable.
*/
async function loadBasemap() {
  const response = await fetch(
    "https://tiles.openfreemap.org/styles/liberty"
  );
  if (!response.ok) throw new Error("Basemap style could not be loaded.");

  const style = await response.json();

  function usesName(value) {
    if (typeof value === "string") {
      return /\{name[^}]*\}/.test(value);
    }
    if (!Array.isArray(value)) return false;
    if (
      value[0] === "get" &&
      typeof value[1] === "string" &&
      /^name($|[:_])/.test(value[1])
    ) return true;
    return value.some(usesName);
  }

  for (const layer of style.layers) {
    if (
      layer.type === "symbol" &&
      layer.layout &&
      usesName(layer.layout["text-field"])
    ) {
      layer.layout["text-field"] = [
        "coalesce",
        ["get", "name:en"],
        ["get", "name_en"],
        ["get", "name"],
        ""
      ];
    }
  }

  maplibreGL({
    style,
    attribution:
      '<a href="https://openfreemap.org/">OpenFreeMap</a> · ' +
      '<a href="https://openmaptiles.org/">OpenMapTiles</a> · ' +
      '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
}

loadBasemap().catch(error => {
  console.error(error);
  const notice = document.querySelector(".notice");
  notice.append(document.createTextNode(
    " Background map could not load. Please refresh; the site pins remain available."
  ));
});

const markerGroup = L.featureGroup().addTo(map);
const controls = {
  country: document.getElementById("country"),
  type: document.getElementById("type"),
  status: document.getElementById("status")
};
let selectedId = null;

if (window.ResizeObserver) {
  new ResizeObserver(() => map.invalidateSize())
    .observe(document.getElementById("map"));
} else {
  window.addEventListener("resize", () => map.invalidateSize());
}

function populateSelect(element, field) {
  element.add(new Option("All", ""));
  [...new Set(sites.map(site => site[field]))]
    .sort()
    .forEach(value => element.add(new Option(value, value)));
}

populateSelect(controls.country, "country");
populateSelect(controls.type, "type");
populateSelect(controls.status, "status");

Object.entries(colours).forEach(([label, colour]) => {
  const row = document.createElement("div");
  row.className = "legend-item";
  const swatch = document.createElement("span");
  swatch.className = "swatch";
  swatch.style.backgroundColor = colour;
  row.append(swatch, document.createTextNode(label));
  document.getElementById("legend").append(row);
});

function safeUrl(value) {
  if (!value) return null;
  try {
    const url = new URL(value, document.baseURI);
    return ["https:", "http:"].includes(url.protocol)
      ? url.href : null;
  } catch {
    return null;
  }
}

function makePlaceholder() {
  const box = document.createElement("div");
  box.className = "image-placeholder";
  const title = document.createElement("strong");
  title.textContent = "Site photograph";
  const note = document.createElement("span");
  note.textContent = "Image placeholder — demonstration only";
  box.append(title, note);
  return box;
}

function showDetails(site) {
  selectedId = site.id;
  const panel = document.getElementById("details");
  panel.replaceChildren();

  const title = document.createElement("h2");
  title.id = "details-title";
  title.textContent = site.name;

  const location = document.createElement("p");
  location.textContent = `${site.city}, ${site.country}`;

  const notice = document.createElement("p");
  notice.className = "demo-tag";
  notice.textContent = "Fictional record — not an actual judgment or site.";
  panel.append(title, location, notice);

  const figure = document.createElement("figure");
  const caption = document.createElement("figcaption");
  const imageUrl = safeUrl(site.imageUrl);

  if (imageUrl) {
    const image = document.createElement("img");
    image.alt = site.imageCaption || site.name;
    image.loading = "lazy";
    image.addEventListener("error", () => {
      image.replaceWith(makePlaceholder());
      caption.textContent = "Image unavailable — placeholder shown.";
    }, {once: true});
    image.src = imageUrl;
    figure.append(image);
    caption.textContent = [site.imageCaption, site.imageCredit]
      .filter(Boolean).join(" — ");
  } else {
    figure.append(makePlaceholder());
    caption.textContent =
      "A photograph, caption, and image credit will appear here.";
  }
  figure.append(caption);
  panel.append(figure);

  const list = document.createElement("dl");

  function addField(label, value) {
    const term = document.createElement("dt");
    term.textContent = label;
    const definition = document.createElement("dd");
    definition.textContent = value || "Not supplied in this demo";
    list.append(term, definition);
  }

  addField("Court case", site.caseName);
  addField("Site type", site.type);
  addField("Judgment date", site.judgmentDate);
  addField("Ordered measure", site.measure);
  addField("Implementation status", site.status);
  addField("Inauguration date", site.inaugurationDate);
  addField("Description", site.description);
  addField("Last verified", site.verified);

  function addSource(label, value) {
    const term = document.createElement("dt");
    term.textContent = label;
    const definition = document.createElement("dd");
    const url = safeUrl(value);
    if (url) {
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Open source";
      definition.append(link);
    } else {
      definition.textContent =
        "Source link placeholder — no fictional document provided";
    }
    list.append(term, definition);
  }

  addSource("Official judgment", site.judgmentUrl);
  addSource("Implementation evidence", site.implementationUrl);
  panel.append(list);
  panel.scrollTop = 0;
}

function clearDetails() {
  selectedId = null;
  const panel = document.getElementById("details");
  panel.replaceChildren();
  const title = document.createElement("h2");
  title.id = "details-title";
  title.textContent = "Select a site";
  const text = document.createElement("p");
  text.textContent =
    "Click a pin to display its photograph area and case details.";
  panel.append(title, text);
}

function render() {
  markerGroup.clearLayers();

  const visible = sites.filter(site =>
    (!controls.country.value || site.country === controls.country.value) &&
    (!controls.type.value || site.type === controls.type.value) &&
    (!controls.status.value || site.status === controls.status.value)
  );

  visible.forEach(site => {
    const icon = L.divIcon({
      className: "pin-icon",
      html:
        `<div class="pin" style="background:${colours[site.type] || "#3D332B"}"></div>`,
      iconSize: [30, 38],
      iconAnchor: [14, 34],
      popupAnchor: [0, -32]
    });

    const popup = document.createElement("div");
    const heading = document.createElement("strong");
    heading.textContent = site.name;
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "Read case details";
    button.addEventListener("click", () => {
      showDetails(site);
      if (window.matchMedia("(max-width: 999px)").matches) {
        document.getElementById("details").scrollIntoView({
          behavior: "smooth", block: "start"
        });
      }
    });
    popup.append(heading, button);

    L.marker([site.lat, site.lng], {
      icon, title: site.name, alt: site.name
    })
      .bindPopup(popup)
      .on("click", () => showDetails(site))
      .addTo(markerGroup);
  });

  const caseCount = new Set(visible.map(site => site.caseId)).size;
  document.getElementById("count").textContent =
    `${visible.length} of ${sites.length} sites shown · ${caseCount} distinct cases` +
    (visible.length ? "" : " · No matches. Reset or change the filters.");

  if (selectedId && !visible.some(site => site.id === selectedId)) {
    clearDetails();
  }

  if (visible.length) {
    map.fitBounds(markerGroup.getBounds(), {
      padding: [35, 35], maxZoom: 12
    });
  }
}

Object.values(controls).forEach(control =>
  control.addEventListener("change", render)
);

document.getElementById("reset").addEventListener("click", () => {
  Object.values(controls).forEach(control => control.value = "");
  clearDetails();
  render();
});

render();
</script>
</body>
</html>
